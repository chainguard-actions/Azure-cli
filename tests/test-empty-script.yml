name: Test Azure CLI with empty script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inlineScript: '   '
          azcliversion: '2.61.0'
      - name: Assert action failed with empty script
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with empty/whitespace script, got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed with empty/whitespace script"
