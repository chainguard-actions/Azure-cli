name: Test invalid azcliversion fails gracefully
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run script with invalid azcliversion
        id: action
        uses: .
        continue-on-error: true
        with:
          inlineScript: |
            echo "This should not run with invalid version"
          azcliversion: '0.0.0-invalid-version'

      - name: Assert action failed or handled invalid version gracefully
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed for invalid azcliversion"
          elif [ "$OUTCOME" = "success" ]; then
            echo "WARN: action succeeded despite invalid version (MCR tag list was unreachable, so version was not validated)"
            echo "PASS: acceptable outcome when MCR tag list is unreachable"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
