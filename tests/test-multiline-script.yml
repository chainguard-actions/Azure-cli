name: Test multiline inline script
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inlineScript: |
            echo "Step 1: checking az version"
            az --version
            echo "Step 2: listing az account (no auth needed for help)"
            az account --help
        continue-on-error: true
      - name: Assert multiline script ran
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to run a multiline script inside the azure-cli Docker image.
          # Success means Docker pulled the image and ran all script steps.
          # Failure is acceptable if Docker/network is unavailable in the harness.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: multiline script executed successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/network issue in harness is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
