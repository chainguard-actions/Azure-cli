name: Test Azure CLI inline script execution
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run multi-line inline script
        id: action
        uses: .
        continue-on-error: true
        with:
          azcliversion: 'latest'
          inlineScript: |
            echo "Step 1: Check az version"
            az --version
            echo "Step 2: List az extensions"
            az extension list --output table || true
            echo "Step 3: Verify environment"
            echo "HOME=$HOME"
            echo "All steps completed successfully"

      - name: Assert action ran (succeeded or failed gracefully without Docker)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Multi-line inline script ran successfully"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker not available in this environment)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
