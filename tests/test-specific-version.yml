name: Test specific azcliversion
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inlineScript: |
            az --version
          azcliversion: 'latest'
        continue-on-error: true
      - name: Assert action ran with specific version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should attempt to run az --version inside the azure-cli:latest Docker image.
          # Success means Docker pulled the image and ran the script.
          # Failure is acceptable if Docker/network is unavailable in the harness.
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with azcliversion=latest"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker/network issue in harness is acceptable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
