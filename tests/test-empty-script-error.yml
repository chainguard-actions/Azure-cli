name: Test empty script error handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          inlineScript: '   '
        continue-on-error: true
      - name: Assert action fails on empty script
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail when given a whitespace-only script,
          # because it validates that the script is non-empty.
          if [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action correctly failed on empty/whitespace-only script"
          elif [ "$OUTCOME" = "success" ]; then
            echo "FAIL: action should have failed on empty script but succeeded"
            exit 1
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
