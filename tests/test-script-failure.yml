name: Test Azure CLI script failure handling
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run failing script
        id: action
        uses: .
        continue-on-error: true
        with:
          azcliversion: 'latest'
          inlineScript: |
            echo "About to fail..."
            exit 1

      - name: Assert action failed as expected
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed (script exits with non-zero, or Docker not available)"
