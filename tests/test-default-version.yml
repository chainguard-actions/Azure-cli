name: Test Azure CLI with default version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inlineScript: echo "Azure CLI is available"
          # azcliversion not set — uses default 'agentazcliversion', which
          # falls back to 'latest' if az is not installed on the agent
      - name: Assert action ran (succeeded or failed gracefully due to Docker unavailability)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: Azure CLI action ran successfully with default version"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (Docker or MCR not available in act harness)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
